<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <h2>1. Hiệu ứng Card Hover, Image Zoom và Button Hover</h2>
    <!-- Card sản phẩm sẽ kết hợp 3 hiệu ứng đầu tiên -->
    <div class="card">
        <div class="img-container">
            <img src="https://placehold.co/300x200?text=Hitman+3" alt="Hitman 3">
        </div>
        <h3>Code Game Hitman 3</h3>
        <p>1.200.000đ</p>
        <button class="btn">Mua ngay</button>
    </div>

    <h2>2. Hiệu ứng Loading Spinner</h2>
    <!-- Vòng xoay vô tận -->
    <div class="spinner"></div>

    <h2>3. Hiệu ứng Fade-in (CSS Only)</h2>
    <!-- Khối này sẽ mờ dần và trượt lên khi trang được hiển thị -->
    <div class="fade-in-element">
        <p>Khối nội dung này xuất hiện với hiệu ứng Fade-in mượt mà!</p>
    </div>

</body>
</html>
